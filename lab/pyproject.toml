[project]
name = "visao"
version = "0.1.0"
description = "Laboratório do sistema de detecção de obstáculos para acessibilidade (referência para o app Flutter)."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Fase 0.5 em diante: tocar bipes e clipes (ADR-008).
audio = [
    "sounddevice>=0.5",
]
# Só para (re)gerar os clipes de voz com o Piper — nunca embarcado no app (ADR-008).
# piper-tts (piper1-gpl) é GPL-3.0: ferramenta de build separada, compatível com o AGPL-3.0
# deste repositório; o áudio gerado não herda a licença da ferramenta.
voz = [
    "piper-tts>=1.2",
]
# Fase 1 em diante: detecção, tracking e captura.
visao = [
    "ultralytics>=8.3",
    "onnxruntime>=1.20",
    "opencv-python>=4.10",
]
# Perfil notebook (i3, Intel).
openvino = [
    "openvino>=2024.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visao"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
